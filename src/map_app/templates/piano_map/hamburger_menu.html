<!-- ハンバーガーメニュー本体 -->

    <button id="hamburger-close" class="hamburger-close" type="button" aria-label="メニューを閉じる">
        ×
    </button>

    <h2 class="hamburger-title">
        📋 メニュー
    </h2>

    <button id="open-statistics-button" class="menu-item" type="button">
        <span class="menu-item-icon">📊</span>
        <div>
            <div class="menu-item-title">統計情報</div>
            <div class="menu-item-subtitle">訪問データを見る</div>
        </div>

    <button id="open-videos-button" class="menu-item" type="button">
        <span class="menu-item-icon">🎬</span>

            <div class="menu-item-title">動画ライブラリ</div>
            <div class="menu-item-subtitle">公開動画を見る</div>
        </div>
    </button>

    <button id="open-admin-button" class="menu-item" type="button">
        <span class="menu-item-icon">⚙️</span>
        <div>
            <div class="menu-item-title">管理画面</div>
            <div class="menu-item-subtitle">データを編集</div>
        </div>
    </button>
</div>
